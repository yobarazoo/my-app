name: Sync to CodeCommit

on:
  push:
    branches: [ "**" ] # すべてのブランチのプッシュをトリガーにするで
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 全履歴と全ブランチを取得するために必須やで！

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }} # Variablesからリージョンを取得！

      - name: Git Setup & Push to CodeCommit
        run: |
          # CodeCommit用のgitヘルパーを入れる超便利ツール
          pip install git-remote-codecommit

          # リモートリポジトリを追加（VariablesからURLを取得！）
          git remote add codecommit ${{ vars.CODECOMMIT_REPO_URL }}
          
          # 認証情報のセットアップ
          git config --global credential.helper '!aws codecommit credential-helper $@'
          git config --global credential.UseHttpPath true

          # 全ブランチとタグをCodeCommitに強制プッシュ！
          git push codecommit --all --force
          git push codecommit --tags --force
