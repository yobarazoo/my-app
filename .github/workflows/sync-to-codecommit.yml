
name: Sync GitHub to AWS CodeCommit

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      # 1. GitHubのリポジトリを取得
      - name: Checkout GitHub repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # 2. AWSのIAMロールを引き受ける
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::679353609733:role/GitHubActionsCodeCommitSyncRole
          aws-region: ap-northeast-1

      # 3. AWSの認証情報を使ってCodeCommitへ接続
      - name: Configure Git for CodeCommit
        run: |
          git config --global credential.helper '!aws codecommit credential-helper $@'
          git config --global credential.UseHttpPath true

      # 4. CodeCommitをリモートに登録
      - name: Add CodeCommit remote
        run: |
          git remote add codecommit \
            https://git-codecommit.ap-northeast-1.amazonaws.com/v1/repos/my-app

      # 5. GitHubのmainブランチをCodeCommitへ同期
      - name: Push to CodeCommit
        run: |
          git push codecommit HEAD:refs/heads/main
